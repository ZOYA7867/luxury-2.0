name: Fix Project Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move Project to Root
        run: |
          SRC="luxury 2.0/kadappa-cafe-main"

          if [ ! -f "$SRC/package.json" ]; then
            echo "package.json not found!"
            exit 1
          fi

          shopt -s dotglob
          for item in "$SRC"/*; do
            [ -e "$item" ] || continue
            name=$(basename "$item")

            if [ -e "$name" ]; then
              echo "Conflict: $name already exists"
              exit 1
            fi

            mv "$item" .
          done

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move website project to repository root"
          git push
