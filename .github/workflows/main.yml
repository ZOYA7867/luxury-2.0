name: Extract Luxury 2.0 ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -iname "luxury 2.0.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: luxury 2.0.zip not found!"
            exit 1
          fi

          mkdir -p "luxury 2.0"
          unzip -o "$ZIP_FILE" -d "luxury 2.0"

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "luxury 2.0"

          if git diff --cached --quiet; then
            echo "No new extracted changes to commit."
          else
            git commit -m "Extract Luxury 2.0 ZIP"
            git push
          fi
